{{- if and .Values.init.enabled (not .Values.init.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wg-easy.initSecretName" . }}
  labels:
    {{- include "wg-easy.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.init.usernameKey }}: {{ .Values.init.username | quote }}
  {{ .Values.init.passwordKey }}: {{ .Values.init.password | quote }}
{{- end }}
