# -- Image. The tag defaults to .Chart.AppVersion. Pin it (or a digest) so the
# image only changes when you change it.
image:
  repository: ghcr.io/wg-easy/wg-easy
  tag: "15.5.0"
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
# -- Web UI / app settings (wg-easy v15 env vars).
web:
  # Port the web UI listens on inside the pod (PORT).
  port: 51821
  # Bind address (HOST).
  host: "0.0.0.0"
  insecure: true
# Disable IPv6 inside WireGuard (DISABLE_IPV6). Most clusters have no pod IPv6.
disableIPv6: true
# Debug namespaces, e.g. "Server,WireGuard,Database,CMD". Empty = off.
debug: ""
# -- WireGuard UDP port. Used as INIT_PORT, the container port and the Service
# port, because wg-easy listens on the same port it tells clients to use.
# If you later change the port in the web UI, change it here too.
wireguard:
  port: 51820
# -- Unattended first-run setup (INIT_* env vars). Only applied on the very
# first start (empty database); afterwards everything lives in the web UI.
init:
  enabled: false
  # Public hostname/IP clients connect to (INIT_HOST). Required when enabled.
  host: ""
  # Admin credentials (INIT_USERNAME / INIT_PASSWORD). Either set them here
  # (a Secret is generated) or point existingSecret at your own Secret.
  username: admin
  password: ""
  existingSecret: ""
  usernameKey: username
  passwordKey: password
  # Optional groups. Group rules from upstream: ipv4Cidr and ipv6Cidr must be
  # set together.
  dns: "" # e.g. "1.1.1.1,8.8.8.8"
  ipv4Cidr: "" # e.g. "10.8.0.0/24"
  ipv6Cidr: "" # e.g. "fdcc:ad94:bacf:61a4::cafe:0/112"
  allowedIps: "" # e.g. "0.0.0.0/0,::/0"
extraEnv: []
#  - name: SOME_VAR
#    value: "x"

# -- Kernel settings WireGuard needs for routing.
# mode: initContainer -> a privileged busybox init container runs `sysctl -w`
#                        inside the pod's network namespace (works on a stock
#                        kubeadm kubelet).
# mode: securityContext -> pod-level sysctls; needs the kubelet flag
#                        --allowed-unsafe-sysctls=net.ipv4.ip_forward,net.ipv4.conf.all.src_valid_mark
# mode: none -> you handle it (e.g. hostNetwork + host sysctls).
sysctls:
  mode: initContainer
  image:
    repository: docker.io/library/busybox
    tag: "1.37"
    pullPolicy: IfNotPresent
# Mount the host's /lib/modules read-only so the container can load the
# wireguard module if it isn't loaded yet (mirrors upstream compose).
hostModules:
  enabled: true
securityContext:
  capabilities:
    add:
      - NET_ADMIN
      - SYS_MODULE
      # - NET_RAW
podSecurityContext: {}
persistence:
  enabled: true
  existingClaim: ""
  storageClass: "ceph-block"
  accessModes:
    - ReadWriteOnce
  size: 256Mi
  annotations: {}
# -- UDP Service for WireGuard traffic.
service:
  wireguard:
    type: LoadBalancer
    annotations: {}
    # MetalLB: either loadBalancerIP or an annotation such as
    # metallb.universe.tf/loadBalancerIPs / metallb.io/loadBalancerIPs
    loadBalancerIP: ""
    loadBalancerClass: ""
    # Local keeps the client source IP and avoids an extra SNAT hop.
    externalTrafficPolicy: Local
    nodePort: ""
  # TCP Service for the web UI.
  web:
    type: ClusterIP
    annotations: {}
    port: 51821
    loadBalancerIP: ""
    nodePort: ""
probes:
  liveness:
    enabled: true
    initialDelaySeconds: 15
    periodSeconds: 20
  readiness:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi
podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
# Run in the host network namespace instead of using the UDP Service.
# Pin the pod to a node with nodeSelector when you use this.
hostNetwork: false
